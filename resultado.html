<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CodeQuest - Resultado</title>

    <link rel="stylesheet" href="estilo.css">
</head>

<body>

    <main class="resultado-container">

        <div class="resultado-card">

            <h1>🎉 Quiz finalizado!</h1>

            <p id="nomeResultado"></p>

            <div class="pontuacao">
                <span id="pontuacao"></span>
            </div>

            <p id="mensagemResultado"></p>

            <div class="botoes-resultado">

                <button id="jogarNovamente">
                    JOGAR NOVAMENTE
                </button>

                <button id="verRanking">
                    VER RANKING
                </button>

            </div>

        </div>

    </main>

    <script src="resultado.js"></script>

</body>

</html>
