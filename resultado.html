<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CodeQuest - Resultado</title>

    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./final.css">
</head>

<body>

    <main class="quiz-container final">

        <header class="quiz-header">
            <img
                src="./CodeQuest-logo_sfundo.svg"
                alt="Logo CodeQuest"
                class="logo"
            >
        </header>

        <section class="resultado">

            <p class="resultado-emoji" id="emoji">🎉</p>

            <h1 class="titulo-final">Quiz finalizado!</h1>

            <p class="resultado-nome" id="nome"></p>

            <p class="placar">
                <span id="pontos">0</span><small>/<span id="total">10</span></small>
            </p>

            <p class="resultado-msg" id="mensagem"></p>

            <div class="acoes">
                <a class="botao botao-principal" href="./login.html">Jogar novamente</a>
                <a class="botao botao-secundario" href="./ranking.html">Ver ranking</a>
            </div>

        </section>

    </main>

    <script src="resultado.js"></script>

</body>

</html>
