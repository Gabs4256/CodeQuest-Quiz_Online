<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <title>CodeQuest | Quiz online</title>
</head>
<body>
    <header class="cabecalho">
        <img class="logo" src="./CodeQuest-logo-removebg.svg" alt="Logo CodeQuest | Cérebro amarelo com a escrita do Quiz">
        <img class="escrita" src="./ESCRITA.svg" alt="Escrita SEU QUIZ ONLINE">

        <a class="botao_ranking" href="./ranking.html">
            Ranking
            <img class="trofeu" src="./trofeu-cortado-removebg-preview.svg" alt="">
        </a>
    </header>

    <main>
        <div class="card">
            <h1 class="frase_destaque">SE DESENVOLVA COM A GENTE</h1>

            <form action="./quiz.html" method="get">
                <input type="text" id="nomeJogador" name="nomeJogador" placeholder="Digite seu nome" required>
                <button type="submit">INICIAR</button>
            </form>
        </div>
    </main>
</body>
</html>
