<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CodeQuest - Quiz</title>

    <link rel="stylesheet" href="estilo.css">
</head>

<body>

    <main class="quiz-container">

        <header class="quiz-header">

            <img
                src="CodeQuest-logo-removebg.svg"
                alt="Logo CodeQuest"
                class="logo"
            >

            <span class="contador">1/10</span>

        </header>

        <section class="pergunta">

            <h1>Pergunta 1</h1>

            <h2>
                Programador Qual é linguagem é utilizada para estruturar
                páginas na Web?
            </h2>

        </section>

        <section class="alternativas">

            <button class="alternativa">
                A) Python
            </button>

            <button class="alternativa">
                B) HTML
            </button>

            <button class="alternativa">
                C) Java
            </button>

            <button class="alternativa">
                D) SQL
            </button>

        </section>

        <button class="proxima">
            Próxima pergunta
        </button>

    </main>

</body>

</html>
