<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CodeQuest - Quiz</title>

    <link rel="stylesheet" href="estilo.css">
</head>

<body>

    <main class="quiz-container">

        <header class="quiz-header">

            <img
                src="CodeQuest-logo-removebg.svg"
                alt="Logo CodeQuest"
                class="logo"
            >

            <div class="contador">
                1/10
            </div>

        </header>


        <section class="pergunta">

            <span class="numero-pergunta">QUESTÃO 01</span>

            <h1>Pergunta 1</h1>

            <h2>
                Qual estrutura é utilizada para executar um bloco de código
                somente quando uma condição é verdadeira?
            </h2>

        </section>


        <section class="alternativas">

            <button class="alternativa">
                A) for
            </button>

            <button class="alternativa">
                B) if
            </button>

            <button class="alternativa">
                C) print
            </button>

            <button class="alternativa">
                D) while
            </button>

        </section>


        <button class="proxima">
            Próxima pergunta →
        </button>

    </main>

    <script src="quiz.js"></script>

</body>

</html>
