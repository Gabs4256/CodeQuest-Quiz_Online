<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CodeQuest - Quiz</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <main class="quiz-container">

        <header class="quiz-header">

            <img
                src="./CodeQuest-logo_sfundo.svg"
                alt="Logo CodeQuest"
                class="logo"
            >

            <div class="quiz-status">
                <span class="status-text">PROGRESSO</span>
                <div class="contador">1/10</div>
            </div>

        </header>


        <div class="barra-container">
            <div class="barra-progresso"></div>
        </div>


        <section class="pergunta">

            <span class="numero-pergunta">QUESTÃO 01</span>

            <h1>Pergunta 1</h1>

            <h2>
                Qual estrutura é utilizada para executar um bloco de código
                somente quando uma condição é verdadeira?
            </h2>

        </section>


        <section class="alternativas">

            <button class="alternativa">
                <span class="letra">A</span>
                <span class="texto-alternativa">for</span>
            </button>

            <button class="alternativa">
                <span class="letra">B</span>
                <span class="texto-alternativa">if</span>
            </button>

            <button class="alternativa">
                <span class="letra">C</span>
                <span class="texto-alternativa">print</span>
            </button>

            <button class="alternativa">
                <span class="letra">D</span>
                <span class="texto-alternativa">while</span>
            </button>

        </section>


        <footer class="quiz-footer">

            <p class="dica">Escolha uma alternativa para continuar</p>

            <button class="proxima">
                Próxima pergunta <span>→</span>
            </button>

        </footer>

    </main>

    <script src="quiz.js"></script>

</body>

</html>
